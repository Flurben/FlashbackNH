tasks.named("test", Test) {
    useJUnitPlatform()
}

// Test harness (see dev/DevDriver): gradlew runClient -PfbnhDev
if (project.hasProperty("fbnhDev")) {
    tasks.matching { it.name.startsWith("runClient") || it.name.startsWith("runObfClient") }.configureEach {
        jvmArgs("-Dflashbacknh.dev=true")
    }
}

// Match the GTNHLib version of the GTNH 2.8.4 pack in the dev client, rather than the newest one some test dependency
// asks for (which also pulls in GTNHExtLib, a jar the pack does not contain).
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.github.GTNewHorizons" && details.requested.name == "GTNHLib") {
            details.useVersion("0.7.10")
        }
    }
    exclude group: "com.github.GTNewHorizons", module: "GTNHExtLib"
    // an old compile-time dependency of a mod GT5-Unofficial uses; this version is no longer published
    exclude group: "com.github.GTNewHorizons", module: "CodeChickenLib"
}
